# Every window on the stuff screen comes from this list.
# To add a thing, copy one block below, paste it at the end, and change the words.
# Only "name" is required. Everything else is optional.
#
#   name:  what it is called
#   kind:  a word or two (project, drawing, tool, experiment, list...)
#   year:  when
#   note:  a sentence, or several paragraphs after `note: |`. Markdown works: $$E = mc^2$$ for maths,
#          ``` fences for code, | pipes | for tables.
#   link:  where it lives

- name: arnavraja.in
  kind: drawing
  year: 2026
  note: A round vector screen and a light pen, after Sketchpad, 1963. Every line you draw has to be retraced by the beam, so the more you draw, the more it all flickers.
  link: https://arnavraja.in

- name: "Ashwater: The Bell Debt"
  kind: game
  year: 2026
  note: An original dark fantasy RPG that runs in the browser.
  link: https://stuff.arnavraja.in/ashwater/
