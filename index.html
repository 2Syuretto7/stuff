<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stuff / arnav raja</title>
<meta name="description" content="{{ site.description }}">
<meta name="theme-color" content="#123c37">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23123c37'/%3E%3Cpath d='M6 24 C10 18 12 20 16 14 S22 8 26 7' stroke='%23ffcf6e' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M16 14 C17 19 21 21 25 24' stroke='%237ea860' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='26' cy='7' r='2.6' fill='%23ff4f7a'/%3E%3Ccircle cx='25' cy='24' r='2.2' fill='%23ff4f7a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/culture.css?v={{ site.time | date: '%s' }}">
</head>
<body>
<canvas id="culture" aria-hidden="true"></canvas>

<header class="top">
  <h1>stuff</h1>
  <p>{{ site.description }}</p>
</header>

<nav id="specimens" aria-label="Things in the culture"></nav>

<p class="hint" id="hint">Hold anywhere to feed it.</p>

<aside class="card" id="card" aria-live="polite" hidden>
  <button class="close" id="close" type="button">Close</button>
  <p class="meta" id="c-meta"></p>
  <h2 id="c-name"></h2>
  <p class="note" id="c-note"></p>
  <a id="c-link">Go there</a>
</aside>

<footer class="foot">
  <a href="https://arnavraja.in">arnavraja.in</a>
  <a href="https://blog.arnavraja.in">blog</a>
</footer>

<noscript><ul class="plain">{% for t in site.data.stuff %}<li>{% if t.link %}<a href="{{ t.link }}">{{ t.name }}</a>{% else %}{{ t.name }}{% endif %}</li>{% endfor %}</ul></noscript>

<script>window.STUFF = {{ site.data.stuff | jsonify }};</script>
<script src="assets/culture.js?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
