<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stuff / arnav raja</title>
<meta name="description" content="{{ site.description }}">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%2300c8ff' opacity='.85'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/look.css?v={{ site.time | date: '%s' }}">
</head>
<body>
<h1 class="sr">stuff, by Arnav Raja</h1>
<main class="field" id="field">
  <p class="meta" id="meta"></p>
  <p class="name" id="name"><a id="link"></a></p>
  <p class="note" id="note"></p>
</main>
<p class="ask" id="ask">Hold to look.</p>
<nav class="sr" aria-label="Everything here">
  <ul>{% for t in site.data.stuff %}<li>{% if t.link %}<a href="{{ t.link }}">{{ t.name }}</a>{% else %}{{ t.name }}{% endif %}</li>{% endfor %}</ul>
</nav>
<script>window.STUFF = {{ site.data.stuff | jsonify }};</script>
<script src="assets/look.js?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
