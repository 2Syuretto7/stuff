<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stuff / arnav raja</title>
<meta name="description" content="{{ site.description }}">
<meta name="theme-color" content="#ff6a2b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ff6a2b'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='6' stroke='%231d0f3f' stroke-width='2' fill='none' transform='rotate(-25 16 16)'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%231d0f3f'/%3E%3Ccircle cx='26' cy='11' r='2.5' fill='%23fff4e8'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="assets/stuff.css?v={{ site.time | date: '%s' }}">
</head>
<body>
<header class="top">
  <h1>stuff</h1>
  <p>{{ site.description }}</p>
</header>

<svg id="sky" aria-hidden="true"></svg>

<div class="clock" id="clock" aria-hidden="true">time &times;1.0</div>

<section class="ledger" aria-label="Everything in orbit">
  <h2>{{ site.data.stuff | size }} bodies</h2>
  <ul id="ledger"></ul>
  <p class="how">Scroll to bend time. Hover to stop it.</p>
</section>

<aside class="card" id="card" aria-live="polite" hidden>
  <button class="close" id="close" aria-label="Close">close</button>
  <p class="meta" id="c-meta"></p>
  <h2 id="c-name"></h2>
  <p id="c-note"></p>
  <a id="c-link" target="_blank" rel="noopener">Go there</a>
</aside>

<footer class="foot">
  <a href="https://arnavraja.in">arnavraja.in</a>
  <a href="https://blog.arnavraja.in">blog</a>
</footer>

<script>window.STUFF = {{ site.data.stuff | jsonify }};</script>
<script src="assets/orrery.js?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
