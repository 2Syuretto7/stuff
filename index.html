---
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stuff / arnav raja</title>
<meta name="description" content="{{ site.description }}">
<meta name="theme-color" content="#c9c3b8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23c9c3b8'/%3E%3Cg fill='%231d1a16'%3E%3Crect x='4' y='6' width='3' height='3'/%3E%3Crect x='13' y='4' width='3' height='3'/%3E%3Crect x='22' y='9' width='3' height='3'/%3E%3Crect x='8' y='13' width='3' height='3'/%3E%3Crect x='19' y='16' width='3' height='3'/%3E%3C/g%3E%3Crect x='3' y='24' width='26' height='2' fill='%231d1a16'/%3E%3Crect x='17' y='20' width='2' height='10' fill='%23e5341d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/radio.css?v={{ site.time | date: '%s' }}">
</head>
<body>
<canvas id="static" aria-hidden="true"></canvas>

<header class="top">
  <h1>stuff</h1>
  <p>{{ site.description }}</p>
  <nav class="elsewhere" aria-label="Elsewhere">
    <a href="https://arnavraja.in">arnavraja.in</a>
    <a href="https://blog.arnavraja.in">blog</a>
  </nav>
</header>

<div class="readout" aria-hidden="true">
  <span id="freq">00.0</span><span class="unit">MHz</span>
  <span class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></span>
</div>
<button class="sound" id="sound" type="button" aria-pressed="false">Sound off</button>

<section class="signal" id="signal" aria-live="polite">
  <h2 class="sr" id="s-name"></h2>
  <p class="meta" id="s-meta"></p>
  <p class="note" id="s-note"></p>
  <a class="go" id="s-link">Go there</a>
</section>

<p class="hint" id="hint">Drag, scroll or use the arrow keys to tune.</p>

<div class="tuner">
  <button class="seek" id="seek-down" type="button">Seek down</button>
  <div class="dial" id="dial" role="slider" tabindex="0" aria-label="Frequency" aria-valuemin="87.5" aria-valuemax="108" aria-valuenow="87.5">
    <div class="ticks" id="ticks"></div>
    <div class="needle" id="needle"></div>
  </div>
  <button class="seek" id="seek-up" type="button">Seek up</button>
</div>

<ul class="sr" aria-label="Everything on the dial">{% for t in site.data.stuff %}<li>{% if t.link %}<a href="{{ t.link }}">{{ t.name }}</a>{% else %}{{ t.name }}{% endif %}</li>{% endfor %}</ul>

<script>window.STUFF = {{ site.data.stuff | jsonify }};</script>
<script src="assets/radio.js?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
